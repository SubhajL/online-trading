[pytest]
# Benchmark configuration
addopts =
    --benchmark-only
    --benchmark-autosave
    --benchmark-save-data
    --benchmark-warmup=on
    --benchmark-warmup-iterations=5
    --benchmark-disable-gc
    --benchmark-min-rounds=10
    --benchmark-max-time=1.0
    --benchmark-sort=mean
    --benchmark-group-by=func
    --benchmark-columns=min,max,mean,stddev,median,iqr,outliers,rounds,iterations

# Test markers
markers =
    benchmark: Performance benchmark tests
    performance: Performance-related tests
    load: Load testing
    stress: Stress testing

# Performance thresholds
benchmark_disable = False
benchmark_compare_fail = mean:10%, median:10%

# Storage
benchmark_storage = .benchmarks
benchmark_histogram = benchmark_histograms