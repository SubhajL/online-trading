# Locust Performance Test Scenarios
# Run with: locust --config locust_scenarios.conf

[base]
# Common settings for all scenarios
host = http://localhost:8001
headless = true
html = locust_report.html
csv = locust_stats

[scenario-normal-load]
# Normal trading day simulation
users = 50
spawn-rate = 5
run-time = 10m
locustfile = locustfile.py

[scenario-peak-load]
# Market open/close peak hours
users = 200
spawn-rate = 20
run-time = 15m
locustfile = locustfile.py

[scenario-stress-candles]
# Stress test candle ingestion
users = 100
spawn-rate = 10
run-time = 5m
locustfile = locust_engine_stress.py
tags = candles

[scenario-stress-decisions]
# Stress test decision engine
users = 150
spawn-rate = 30
run-time = 5m
locustfile = locust_engine_stress.py
tags = decisions

[scenario-stress-database]
# Database performance testing
users = 75
spawn-rate = 15
run-time = 10m
locustfile = locust_engine_stress.py
tags = database

[scenario-burst-load]
# Test burst load handling
users = 300
spawn-rate = 100
run-time = 3m
locustfile = locust_engine_stress.py
user-classes = BurstLoadUser

[scenario-endurance]
# Long-running endurance test
users = 25
spawn-rate = 2
run-time = 60m
locustfile = locustfile.py

[scenario-hft-simulation]
# High-frequency trading simulation
users = 50
spawn-rate = 10
run-time = 10m
locustfile = locustfile.py
user-classes = HighFrequencyTradingUser

[scenario-websocket-stress]
# WebSocket connection stress test
users = 200
spawn-rate = 20
run-time = 10m
locustfile = locustfile.py
user-classes = TradingUser
# Focus on WebSocket behavior