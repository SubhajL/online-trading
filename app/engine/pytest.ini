[pytest]
testpaths = tests
python_files = test_*.py
addopts = -m "not integration and not chaos and not performance and not e2e"
markers =
    integration: mark a test as integration (db/network)
    e2e: end-to-end scenarios across components
    chaos: chaos engineering scenarios
    performance: performance/benchmark tests
    redis: tests requiring a real Redis connection
norecursedirs = adapters ingest database plugins retest services smc tests/performance tests/integration tests/chaos tests/e2e
