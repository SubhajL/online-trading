# Air configuration for Go hot reload
root = "."
tmp_dir = "tmp"

[build]
  # Main binary to build
  bin = "./tmp/router"
  # Build command
  cmd = "go build -o ./tmp/router ./cmd/router/main.go"
  # Delay before rebuilding
  delay = 1000
  # Files to exclude
  exclude_dir = ["assets", "tmp", "vendor", "node_modules"]
  # File extensions to watch
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Stop running old binary when building
  kill_delay = "0s"

[log]
  # Show timestamps in logs
  time = false

[color]
  # Colors for output
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Clean on exit
  clean_on_exit = true
