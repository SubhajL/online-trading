name: BFF-Only CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/bff/**'
      - 'db/migrations/**'
      - '.github/workflows/bff-only-ci.yml'

jobs:
  test-bff:
    name: Test BFF Changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: ./app/bff
        run: pnpm install --frozen-lockfile

      - name: Run linting
        working-directory: ./app/bff
        run: |
          pnpm lint
          pnpm format:check

      - name: Run tests
        working-directory: ./app/bff
        run: pnpm test:cov

  security-scan:
    name: Security Scan - BFF
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on BFF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app/bff'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities for now