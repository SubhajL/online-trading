name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    # Auto-review on PR open/update, or manual trigger via @claude comment
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-6 --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this PR for the online trading platform (Python/FastAPI engine, Go/Gin router, TypeScript/NestJS BFF, Next.js UI).

            Check for:
            1. Code correctness and potential bugs — especially in trading logic (position sizing, risk guards, order validation)
            2. Type safety — no `any` in TypeScript, proper mypy annotations in Python, strong Go types
            3. Security — no secrets committed, no OWASP top 10 issues, no SQL injection or XSS
            4. Event contract integrity — changes to `contracts/` must be backward compatible
            5. Test coverage — new features and bug fixes must have colocated tests (*.spec.ts / test_*.py / *_test.go)
            6. Latency impact — flag anything that could breach the ≤700ms p95 candle→order target
            7. Conventional commits and branch naming conventions
            8. Architecture — changes stay within the event-driven pipeline; no cross-service direct calls

            Be concise but thorough. Clearly distinguish blockers from nice-to-haves.

            IMPORTANT: You MUST post your review as a PR comment using `gh pr comment`.
            Only post GitHub comments - do not submit review text as messages.
