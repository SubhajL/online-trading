name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    # Auto-review on PR open/update, or manual trigger via @claude comment
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Workaround: remove local-dev hooks that reference paths not on the runner
      # and can trigger AJV schema validation crashes (see claude-code-action#852, #892, #1021)
      - name: Sanitize settings for CI
        run: |
          if [ -f .claude/settings.json ]; then
            # Strip hooks (local paths don't exist on runner) but keep other settings
            python3 -c "
          import json, sys
          with open('.claude/settings.json') as f:
              s = json.load(f)
          s.pop('hooks', None)
          with open('.claude/settings.json', 'w') as f:
              json.dump(s, f, indent=2)
          " || rm -f .claude/settings.json
          fi

      - name: Run Claude Code Review
        # Pin to latest SHA (2026-03-11, SDK 0.2.73) to pick up AJV crash fixes.
        # The @v1 tag still resolves to an older build with SDK 0.2.70.
        # Revert to @v1 once the tag is updated past the AJV schema drift issue.
        uses: anthropics/claude-code-action@567be3da98ac1cacd803477c9a738bec79484dc0
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-6
            --allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --max-turns 10
          show_full_output: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this PR for the online trading platform (Python/FastAPI engine, Go/Gin router, TypeScript/NestJS BFF, Next.js UI).

            Check for:
            1. Code correctness and potential bugs — especially in trading logic (position sizing, risk guards, order validation)
            2. Type safety — no `any` in TypeScript, proper mypy annotations in Python, strong Go types
            3. Security — no secrets committed, no OWASP top 10 issues, no SQL injection or XSS
            4. Event contract integrity — changes to `contracts/` must be backward compatible
            5. Test coverage — new features and bug fixes must have colocated tests (*.spec.ts / test_*.py / *_test.go)
            6. Latency impact — flag anything that could breach the ≤700ms p95 candle→order target
            7. Conventional commits and branch naming conventions
            8. Architecture — changes stay within the event-driven pipeline; no cross-service direct calls

            Be concise but thorough. Clearly distinguish blockers from nice-to-haves.

            IMPORTANT: You MUST post your review as a PR comment using `gh pr comment`.
            Only post GitHub comments - do not submit review text as messages.
