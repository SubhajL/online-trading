name: Decision Engine Tests

on:
  push:
    branches: [ svc/decision ]
    paths:
      - 'app/engine/decision/**'
      - 'tests/decision/**'
      - '.github/workflows/decision-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/engine/decision/**'
      - 'tests/decision/**'
      - '.github/workflows/decision-tests.yml'

jobs:
  test-decision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/engine

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: |
          app/engine/requirements.txt
          app/engine/requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Run decision module tests
      run: |
        pytest ../../tests/decision/ -v --tb=short --cov=decision --cov-report=xml --cov-report=term-missing

    - name: Check code formatting
      run: |
        black --check decision/

    - name: Run linter
      run: |
        ruff check decision/

    - name: Type check
      run: |
        mypy decision/ --ignore-missing-imports --no-namespace-packages

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: decision
        name: decision-coverage
        fail_ci_if_error: false