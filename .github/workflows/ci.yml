name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  GO_VERSION: "1.21"

jobs:
  # Python Engine Tests
  test-python:
    name: Python Engine Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:2.11.0-pg15
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader123
          POSTGRES_DB: trader
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          cd app/engine
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Python linting
        run: |
          cd app/engine
          make lint

      - name: Run Python type checking
        run: |
          cd app/engine
          make typecheck

      - name: Run Python unit tests
        run: |
          cd app/engine
          python -m pytest tests/unit -v --tb=short --cov=app --cov-report=xml

      - name: Run critical trading tests
        run: |
          cd app/engine
          python -m pytest tests/unit/test_critical_position_sizing.py -v
          python -m pytest tests/unit/test_risk_guards.py -v
          python -m pytest tests/unit/test_order_validation.py -v
          python -m pytest tests/unit/test_smc_algorithms.py -v
          python -m pytest tests/unit/test_indicators.py -v
          python -m pytest tests/unit/test_e2e_trading_flow.py -v

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: app/engine/coverage.xml

  # Go Router Tests
  test-go:
    name: Go Router Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Go dependencies
        run: |
          cd app/router
          go mod download

      - name: Run Go linting
        run: |
          cd app/router
          golangci-lint run

      - name: Run Go tests
        run: |
          cd app/router
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: app/router/coverage.out

  # TypeScript Tests (BFF & UI)
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install TypeScript dependencies
        run: |
          pnpm install

      - name: Run TypeScript linting
        run: |
          pnpm lint

      - name: Run TypeScript type checking
        run: |
          pnpm type-check

      - name: Run BFF tests
        run: |
          cd app/bff
          pnpm test:cov

      - name: Run UI tests
        run: |
          cd app/ui
          pnpm test

      - name: Upload TypeScript coverage
        uses: actions/upload-artifact@v4
        with:
          name: typescript-coverage
          path: |
            app/bff/coverage/lcov.info
            app/ui/coverage/lcov.info

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-python, test-go, test-typescript]

    services:
      postgres:
        image: timescale/timescaledb:2.11.0-pg15
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader123
          POSTGRES_DB: trader
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install all dependencies
        run: |
          # Python
          cd app/engine
          pip install -r requirements.txt
          cd ../..

          # Go
          cd app/router
          go mod download
          cd ../..

          # TypeScript
          pnpm install

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://trader:trader123@localhost:5432/trader
        run: |
          cd app/engine
          alembic upgrade head

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://trader:trader123@localhost:5432/trader
          REDIS_URL: redis://localhost:6379
        run: |
          cd app/engine
          python -m pytest tests/integration -v

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Python security scan
        run: |
          pip install bandit safety
          cd app/engine
          bandit -r . -ll
          safety check --json

      - name: Run Go security scan
        run: |
          cd app/router
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: Run npm audit
        run: |
          pnpm audit --audit-level=high

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-python, test-go, test-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Engine image
        uses: docker/build-push-action@v5
        with:
          context: ./app/engine
          file: ./app/engine/Dockerfile
          tags: trader-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Router image
        uses: docker/build-push-action@v5
        with:
          context: ./app/router
          file: ./app/router/Dockerfile
          tags: trader-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build BFF image
        uses: docker/build-push-action@v5
        with:
          context: ./app/bff
          file: ./app/bff/Dockerfile
          tags: trader-bff:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ./app/ui
          file: ./app/ui/Dockerfile
          tags: trader-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
