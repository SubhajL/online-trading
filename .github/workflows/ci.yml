name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  GO_VERSION: "1.25"
  TEST_DATABASE_URL: "postgresql://trading_user:password@localhost:5432/trading_platform_test"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  # Database Migrations
  db-migrations:
    name: Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: trading_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          cd app/engine
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations (one-shot)
        run: |
          cd app/engine
          PYTHONPATH=../.. python scripts/migrate_db.py --database-url "${{ env.TEST_DATABASE_URL }}"

  # Python Engine Tests
  test-python:
    name: Python Engine Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: trading_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system dependencies (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          cd app/engine
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Python linting
        run: |
          cd app/engine
          python -m ruff check .

      - name: Run Python type checking
        run: |
          python -m mypy --config-file app/engine/mypy.ini --follow-imports=skip \
            app/engine/main.py \
            app/engine/decision/decision_publisher.py \
            app/engine/execution/router_execution_subscriber.py \
            app/engine/adapters/alert/alert_subscriber.py \
            app/engine/adapters/alert/signal_emitter.py \
            app/engine/retest/engine.py \
            app/engine/adapters/db/timescale_adapter.py \
            app/engine/adapters/db/migrations.py \
            app/engine/adapters/db/connection_pool.py \
            app/engine/core/signal_cooldown.py \
            app/engine/core/zone_identity.py

      - name: One-shot migrate (unit tests)
        run: |
          cd app/engine
          PYTHONPATH=../.. python scripts/migrate_db.py --database-url "${{ env.TEST_DATABASE_URL }}"

      - name: Run Python unit tests
        run: |
          cd app/engine
          PYTHONPATH=../.. python -m pytest tests/unit -v --tb=short --cov=app.engine --cov-report=xml

      - name: Run critical trading tests
        run: |
          cd app/engine
          PYTHONPATH=../.. python -m pytest tests/unit/test_critical_position_sizing.py -v
          PYTHONPATH=../.. python -m pytest tests/unit/test_risk_guards.py -v
          PYTHONPATH=../.. python -m pytest tests/unit/test_order_validation.py -v
          PYTHONPATH=../.. python -m pytest tests/unit/test_smc_algorithms.py -v
          PYTHONPATH=../.. python -m pytest tests/unit/test_indicators.py -v
          PYTHONPATH=../.. python -m pytest tests/unit/test_signal_to_order_flow.py -v

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: app/engine/coverage.xml

  # Go Router Tests
  test-go:
    name: Go Router Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: app/router/go.sum

      - name: Install Go dependencies
        run: |
          cd app/router
          go mod download

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.9.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run Go linting
        run: |
          cd app/router
          golangci-lint run

      - name: Run Go tests
        run: |
          cd app/router
          env -u TEST_DATABASE_URL -u REDIS_URL go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: app/router/coverage.out

  # TypeScript Tests (BFF & UI)
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify vendored contracts in sync
        run: |
          bash scripts/check-contracts-sync.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install TypeScript dependencies
        run: |
          cd app/bff
          pnpm install --frozen-lockfile --ignore-workspace
          cd ../ui
          pnpm install --frozen-lockfile --ignore-workspace

      - name: Verify BFF contracts scripts
        run: |
          cd app/bff
          pnpm contracts:check

      - name: Run TypeScript linting
        run: |
          cd app/bff
          pnpm lint
          cd ../ui
          pnpm lint

      - name: Run TypeScript type checking
        run: |
          cd app/bff
          pnpm build
          cd ../ui
          pnpm typecheck

      - name: Run BFF tests
        run: |
          cd app/bff
          pnpm test:cov

      - name: Run UI tests
        run: |
          cd app/ui
          pnpm test

      - name: Upload TypeScript coverage
        uses: actions/upload-artifact@v4
        with:
          name: typescript-coverage
          path: |
            app/bff/coverage/lcov.info
            app/ui/coverage/lcov.info

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-python, test-go, test-typescript]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: trading_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install all dependencies
        run: |
          # Python
          cd app/engine
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          cd ../..

          # Go
          cd app/router
          go mod download
          cd ../..

          # TypeScript
          pnpm install

      - name: Run database migrations
        run: |
          PYTHONPATH=. python app/engine/scripts/migrate_db.py --database-url "${{ env.TEST_DATABASE_URL }}"

      - name: Run integration tests
        run: |
          cd app/engine
          PYTHONPATH=../.. TEST_DATABASE_URL="${{ env.TEST_DATABASE_URL }}" REDIS_URL="${{ env.REDIS_URL }}" python -m pytest -m "integration and not e2e" tests/integration -v

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Run Python security scan
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit safety
          cd app/engine
          bandit -r . -ll || true
          safety check --json || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go security scan
        run: |
          cd app/router
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./... || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Run npm audit
        run: |
          pnpm audit --audit-level=high || true

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-python, test-go, test-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Engine image
        uses: docker/build-push-action@v5
        with:
          # Engine Dockerfile copies `app/` + `db/`, so it must be built from repo root.
          context: .
          file: ./app/engine/Dockerfile
          tags: trader-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Router image
        uses: docker/build-push-action@v5
        with:
          context: ./app/router
          file: ./app/router/Dockerfile
          tags: trader-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build BFF image
        uses: docker/build-push-action@v5
        with:
          context: ./app/bff
          file: ./app/bff/Dockerfile
          tags: trader-bff:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ./app/ui
          file: ./app/ui/Dockerfile
          tags: trader-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
