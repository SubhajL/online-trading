name: Features Branch CI

on:
  push:
    branches: [ svc/features ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/engine/**'
      - '.github/workflows/features-ci.yml'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Python Engine Tests - Only for features implementation
  test-engine-features:
    name: Test Python Engine Features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('app/engine/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./app/engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linting (features only)
        working-directory: ./app/engine
        run: |
          # Only check Python syntax errors, not style
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check black formatting
          black --check .
          # Run mypy ONLY on features and shared/technical modules
          mypy features/ shared/technical/ --ignore-missing-imports --no-strict-optional

      - name: Run features tests
        working-directory: ./app/engine
        run: |
          # Run only feature-related tests
          pytest tests/test_basic.py features/ shared/technical/ -v --cov=features --cov=shared/technical --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./app/engine/coverage.xml
          flags: engine-features

  # Features Golden Tests
  golden-tests:
    name: Features Golden Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd contracts
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas ta numpy
          fi

      - name: Run golden tests
        working-directory: ./contracts
        run: |
          python tests/golden/test_technical_indicators.py

  # SMC Engine Tests (if SMC features are included)
  smc-tests:
    name: SMC Engine Tests
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'smc') || contains(github.event.pull_request.title, 'smc')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SMC tests
        working-directory: ./app/engine
        run: |
          pip install -r requirements.txt
          pytest smc/ -v

  # Security check remains important
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'