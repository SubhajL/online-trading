version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/app/engine"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/app/router"
    schedule:
      interval: "weekly"

  # pnpm workspaces are managed via the root lockfile; Dependabot uses the npm ecosystem.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/app/bff"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/app/ui"
    schedule:
      interval: "weekly"

