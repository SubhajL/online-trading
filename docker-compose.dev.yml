# Docker Compose configuration for development environment


networks:
  trading-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # ===========================
  # Database Services
  # ===========================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-postgres-dev
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password_here}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================
  # Application Services (Development)
  # ===========================
  migrate:
    build:
      context: ./app/engine
      dockerfile: Dockerfile.dev
    container_name: trading-migrate-dev
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-your_secure_password_here}@postgres:5432/${POSTGRES_DB:-trading_platform}
      - PYTHONPATH=/workspace
    working_dir: /workspace
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading-network
    command: ["python", "-m", "app.engine.scripts.migrate_db"]

  engine:
    build:
      context: ./app/engine
      dockerfile: Dockerfile.dev
    container_name: trading-engine-dev
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-your_secure_password_here}@postgres:5432/${POSTGRES_DB:-trading_platform}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-trading_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_secure_password_here}
      - POSTGRES_DB=${POSTGRES_DB:-trading_platform}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-trading_platform}
      - DB_USER=${POSTGRES_USER:-trading_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-your_secure_password_here}
      - REDIS_URL=redis://redis:6379/0
      - ENGINE_PORT=${ENGINE_PORT:-8000}
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=debug
      - PYTHONPATH=/workspace
      - ROUTER_URL=http://router:8001
      - BINANCE_DATA_SOURCE=${BINANCE_DATA_SOURCE:-mainnet}
      - PIPELINE_HEALTH_ALERTS_ENABLED=${PIPELINE_HEALTH_ALERTS_ENABLED:-1}
      - LIVE_REST_FALLBACK_ENABLED=${LIVE_REST_FALLBACK_ENABLED:-1}
      - TRACING_DISABLED=true
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    working_dir: /workspace/app/engine
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - trading-network
    command:
      - uvicorn
      - app.engine.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    healthcheck:
      test: ["CMD-SHELL", "python -m app.engine.scripts.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  router:
    build:
      context: .
      dockerfile: app/router/Dockerfile.dev
    container_name: trading-router-dev
    restart: unless-stopped
    environment:
      - PORT=${ROUTER_PORT:-8001}
      - ENGINE_URL=http://engine:8000
      - ORDER_UPDATE_URL=http://engine:8000/internal/order_update
      - REDIS_URL=redis://redis:6379/0
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_SPOT_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SPOT_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_FUTURES_API_KEY=${BINANCE_FUTURES_API_KEY}
      - BINANCE_FUTURES_API_SECRET=${BINANCE_FUTURES_API_SECRET}
      - BINANCE_FUTURES_SECRET_KEY=${BINANCE_FUTURES_API_SECRET}
      - ROUTER_EXECUTION_ENV=${ROUTER_EXECUTION_ENV:-testnet}
      - TRADING_MODE=${TRADING_MODE:-spot}
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=debug
    ports:
      - "${ROUTER_PORT:-8001}:8001"
    volumes:
      - ./app/router:/app
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  bff:
    build:
      context: .
      dockerfile: app/bff/Dockerfile.dev
    container_name: trading-bff-dev
    restart: unless-stopped
    environment:
      - PORT=3001
      - BFF_PORT=${BFF_PORT:-8002}
      - NODE_ENV=development
      - ENGINE_PUBSUB_URL=redis://redis:6379
      - ROUTER_URL=http://router:8001
      - ROUTER_API_KEY=${ROUTER_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-trading_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_secure_password_here}
      - POSTGRES_DB=${POSTGRES_DB:-trading_platform}
    ports:
      - "${BFF_PORT:-8002}:3001"
    volumes:
      - ./app/bff:/app
      - /app/node_modules  # Exclude node_modules from volume mount
    depends_on:
      engine:
        condition: service_healthy
      router:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network
    command: pnpm run start:dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/api/health/liveness',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build:
      context: .
      dockerfile: app/ui/Dockerfile.dev
    container_name: trading-ui-dev
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${BFF_PORT:-8002}/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:${BFF_PORT:-8002}/trading
      - NEXT_INTERNAL_API_URL=http://bff:3001/api
      - NODE_ENV=development
      - FAST_REFRESH=true
    ports:
      - "${UI_PORT:-3000}:3000"
    volumes:
      - ./app/ui/src:/app/src
      - ./app/ui/public:/app/public
      # node_modules stays in container from build
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - trading-network
    command: pnpm run dev

  # ===========================
  # Development Tools
  # ===========================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: trading-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - trading-network

  # Database management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trading-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tradingplatform.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - trading-network
    depends_on:
      - postgres

  # Redis management UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trading-redis-commander-dev
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - trading-network
    depends_on:
      - redis
